<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignNote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 220px;
      padding: 16px;
      background: #0f0f0f;
      color: #f0f0f0;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #fff;
    }
    p {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #toggle {
      background: #6C63FF;
      color: #fff;
    }
    #toggle:hover { background: #5a52e0; }
    #toggle.active { background: #333; color: #aaa; }
    #shortcut {
      margin-top: 10px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
    kbd {
      font-family: inherit;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <h1>DesignNote</h1>
  <p>Annotate UI elements and copy a structured prompt for Claude.</p>
  <button id="toggle">Activate</button>
  <div id="shortcut">or press <kbd>Alt+Shift+D</kbd></div>
  <script type="module" src="/src/popup.ts"></script>
</body>
</html>
